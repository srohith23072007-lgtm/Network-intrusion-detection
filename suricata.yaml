%YAML 1.1
---
default-log-dir: ./logs

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
        - flow
        - stats:
            totals: yes
            threads: no
            deltas: no

rule-files:
  - ./rules/local.rules
